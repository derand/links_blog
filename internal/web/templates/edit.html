{{define "content" -}}
<h1 class="page-title">Edit link</h1>
<div class="edit-layout">
{{template "link-form" .Form}}
<p class="form-hint link-info">Added {{.Created}}{{with .Source}} via {{.}}{{end}}{{if ne .Updated .Created}}, changed {{.Updated}}{{end}}.
  {{- with .Meta}}<br>{{.}}{{end}}</p>
<form class="delete-form" method="post" action="/delete/{{.ID}}">
  <input name="confirm" type="hidden" value="">
  <button type="submit">Delete link</button>
</form>
</div>
{{- end}}
