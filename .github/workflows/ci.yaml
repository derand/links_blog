# Tests run on every push. A push to master also publishes the image as
# ghcr.io/derand/links_blog:latest. "Run workflow" with a commit builds that
# commit as :sha-<commit> (for rollbacks) and leaves :latest alone; with the
# field empty it rebuilds :latest from master.
name: CI

on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to build as :sha-<commit> (empty = master as :latest)
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - id: tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ]; then
            echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ghcr.io/derand/links_blog:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
