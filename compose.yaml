# Settings and secrets are read from .env next to this file (see .env.example).
# Host-specific changes, such as another network for a proxy container, go to
# compose.override.yaml, which Compose merges automatically.
services:
  linksblog:
    image: ghcr.io/derand/links_blog:${LINKSBLOG_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
