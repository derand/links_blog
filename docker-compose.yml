version: '3.1'

services:
  links-blog:
    image: derand/links-blog
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: links-blog
    hostname: links-blog
    restart: always
    # ports:
    #   - 8000:80
    env_file:
      - credentials.env
    networks:
      - links-blog
      - mongodb
    logging: &default_logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"


networks:
  mongodb:
    external:
      name: mongodb
  links-blog:
    external:
      name: links-blog
